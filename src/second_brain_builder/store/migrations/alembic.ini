# Alembic CLI settings, for development only. The app and the worker run the
# migrations with second_brain_builder.store.migrate(engine) and do not read this file.
#
# Write a new revision (the CLI uses the database in SBB_DATA_DIR):
#   SBB_DATA_DIR=./private/dev-data uv run alembic \
#     -c src/second_brain_builder/store/migrations/alembic.ini \
#     revision --autogenerate --rev-id 0002 -m "add example column"

[alembic]
script_location = %(here)s
file_template = rev_%%(rev)s_%%(slug)s
path_separator = os
